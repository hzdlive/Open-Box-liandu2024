plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.openbox.oss'
    compileSdk 36

    defaultConfig {
        // NOTE: deliberately NOT com.openbox.app (the proprietary app's id).
        applicationId 'com.openbox.oss'
        minSdk 31
        targetSdk 36
        versionCode 1
        versionName '0.1.0-oss'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    // HTTP + JSON for the panel client API (docs/client-api.md)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    // QR scan for pairing: CameraX + ZXing
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.zxing:core:3.5.3'
    // sing-box core: built from the GPL source bundle via gomobile
    // (mirrors the upstream build-libbox.sh flow). Drop the produced
    // libbox.aar into app/libs/ and uncomment:
    // implementation files('libs/libbox.aar')
}
