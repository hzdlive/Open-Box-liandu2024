name: Kernel (sing-box tcp23)

# Builds the patched sing-box kernel (1.14.1-openbox-tcp23) from the
# GPL source bundle published with the upstream releases, for linux
# amd64 + arm64. Binaries are uploaded as workflow artifacts.
#
# The build itself is upstream's own open-box-patch/build.sh
# (patch order, build tags, ldflags and Go version all pinned in
# versions.sh inside the bundle). This workflow only fetches the
# pinned bundle, verifies its sha256, and runs the script.

on:
  workflow_dispatch:
  push:
    branches: [oss]
    paths:
      - '.github/workflows/kernel.yml'
      - 'oss/kernel/**'

env:
  SOURCE_URL: https://github.com/liandu2024/Open-Box/releases/download/v0.1.326/sing-box-1.14.1-openbox-tcp23-source.tar.gz
  # Pinned bundle hash (also mirrored in oss/kernel/README.md).
  SOURCE_SHA256: daf38f19ec94ccdb0c3046de57f06f4950356b2f1be2850586b4988d844150a5

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out this repo (manifest.py records the build's source commit)
        uses: actions/checkout@v4

      - name: Download and verify source bundle
        run: |
          curl -fSL --retry 3 "$SOURCE_URL" -o src.tar.gz
          echo "$SOURCE_SHA256  src.tar.gz" | sha256sum -c -
          tar -xzf src.tar.gz

      - name: Read pinned Go version
        id: goversion
        run: |
          v=$(grep '^SINGBOX_GO_VERSION=' source-bundle/open-box-patch/versions.sh | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "pinned Go: $v"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.goversion.outputs.version }}

      - name: Build kernel (${{ matrix.arch }})
        run: |
          # Upstream packaging quirk: build.sh expects dt-needed.py one level
          # ABOVE open-box-patch/ (as in their dev tree), but the source
          # bundle ships it INSIDE open-box-patch/. Shim the expected layout.
          cp source-bundle/open-box-patch/dt-needed.py source-bundle/dt-needed.py
          OPENBOX_GO_BINARY="$(which go)" \
            sh source-bundle/open-box-patch/build.sh ${{ matrix.arch }} "$PWD/out"

      - name: Smoke test binary
        # NOTE: keep the glob inline in the command — bash does not expand
        # wildcards inside a variable assignment.
        run: |
          file ./out/sing-box-*-linux-${{ matrix.arch }}-musl/sing-box
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            # arm64 binaries cannot execute on the amd64 runner; `file`
            # above already verifies the format.
            ./out/sing-box-*-linux-${{ matrix.arch }}-musl/sing-box version
          fi

      - name: Upload kernel binary
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-tcp23-linux-${{ matrix.arch }}
          path: out/sing-box-*-linux-${{ matrix.arch }}-musl/sing-box
          if-no-files-found: error
