name: Android

on:
  push:
    branches: [oss]
    paths:
      - 'oss/clients/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'oss/clients/android/**'
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # android-actions/setup-android is flaky with current cmdline-tools
      # (sdkmanager "Failed to find package 'tools'"), so install the SDK
      # directly — deterministic and version-pinned.
      - name: Install Android SDK
        run: |
          sudo mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          sudo unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          sudo mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          sudo chown -R "$USER:$USER" "$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: oss/clients/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openbox-oss-android-debug
          path: oss/clients/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
