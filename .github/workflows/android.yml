name: Android

on:
  push:
    branches: [oss]
    paths:
      - 'oss/clients/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'oss/clients/android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oss/clients/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openbox-oss-android-debug
          path: oss/clients/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
